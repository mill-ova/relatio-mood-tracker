const NAMES = ['Sad','Unpleasant','Neutral','Pleasant','Happy'];
const BG = ['#bcc2ff','#b5cdec','#a9efed','#bfefba','#fdf2c3'];
const DOTS = ['#6d69e6','#569cf8','#31b0ae','#37b92c','#ffd429'];
const MOODS = ['sad','unpleasant','neutral','pleasant','happy'].map(k => DATA[k]);

// ——— helpers ———
const $ = id => document.getElementById(id);
const hex2rgb = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
function lerpColor(list, m) {
  const i = Math.min(Math.floor(m), list.length - 2), f = m - i;
  const a = hex2rgb(list[i]), b = hex2rgb(list[i+1]);
  return `rgb(${a.map((v,k)=>Math.round(v+(b[k]-v)*f)).join(',')})`;
}
function lerpNum(vals, m) {
  const i = Math.min(Math.floor(m), vals.length - 2), f = m - i;
  return vals[i] + (vals[i+1]-vals[i])*f;
}
function morphPts(key, m, closed) {
  const i = Math.min(Math.floor(m), 3), f = m - i;
  const a = MOODS[i][key].pts, b = MOODS[i+1][key].pts;
  let d = '';
  for (let k = 0; k < a.length; k += 2) {
    const x = a[k]+(b[k]-a[k])*f, y = a[k+1]+(b[k+1]-a[k+1])*f;
    d += (k===0?'M':'L') + x.toFixed(1) + ' ' + y.toFixed(1);
  }
  return closed ? d+'Z' : d;
}
const layerVals = (key, prop) => MOODS.map(md => md[key][prop]);

// labels
NAMES.forEach(n => { const s = document.createElement('span'); s.textContent = n; $('labels').appendChild(s); });
const labelEls = [...$('labels').children];
// dots
const KNOB = 44, TRACK_W = 376, TRAVEL = TRACK_W - KNOB;
const dotEls = NAMES.map((_,i) => {
  const d = document.createElement('div'); d.className = 'dot';
  d.style.left = (KNOB/2 + i/4*TRAVEL - 3) + 'px';
  $('track').appendChild(d); return d;
});

const CLOSED = ['innerLight','formGlow','petals0','petals1','petals2','petals3'];
const STROKES = ['eyeL','eyeR','mouth','eyeLightL','eyeLightR','mouthLight'];
const FLASH = ['flashBlue','flashWarm','flashMint','specular'];

function render(m) {
  $('bg').style.background = lerpColor(BG, m);
  for (const k of CLOSED) {
    const el = $(k);
    const d = morphPts(k, m, true);
    el.setAttribute('d', d);
    el.setAttribute('fill', lerpColor(layerVals(k,'fill'), m));
    el.setAttribute('opacity', lerpNum(layerVals(k,'op'), m));
    if (k.startsWith('petals')) $('glass' + k.slice(6)).setAttribute('d', d);
  }
  {
    const d = morphPts('core', m, true);
    const core = $('core');
    core.setAttribute('d', d);
    core.setAttribute('opacity', 0.2 * lerpNum(MOODS.map(x=>x.core.op), m));
    [0,1,2].forEach(i => $('cg'+i).setAttribute('stop-color', lerpColor(MOODS.map(x=>x.core.stops[i]), m)));
    $('coreSheen').setAttribute('d', d);
    const edge = $('coreEdge');
    edge.setAttribute('d', d);
    edge.setAttribute('stroke-width', lerpNum(MOODS.map(x=>x.core.strokeW), m));
  }
  for (const k of STROKES) {
    const el = $(k);
    el.setAttribute('d', morphPts(k, m, false));
    el.setAttribute('stroke', lerpColor(layerVals(k,'stroke'), m));
    el.setAttribute('stroke-width', lerpNum(layerVals(k,'w'), m));
    el.setAttribute('opacity', lerpNum(layerVals(k,'op'), m));
  }
  for (const k of FLASH) {
    const el = $(k);
    const cx = lerpNum(layerVals(k,'cx'), m), cy = lerpNum(layerVals(k,'cy'), m);
    el.setAttribute('cx', cx); el.setAttribute('cy', cy);
    el.setAttribute('rx', lerpNum(layerVals(k,'rx'), m));
    el.setAttribute('ry', lerpNum(layerVals(k,'ry'), m));
    el.setAttribute('opacity', lerpNum(layerVals(k,'op'), m));
    el.setAttribute('transform', `rotate(${lerpNum(layerVals(k,'rot'), m)} ${cx} ${cy})`);
    if (k !== 'specular') el.setAttribute('fill', lerpColor(layerVals(k,'fill'), m));
  }
  const g = $('glow');
  g.setAttribute('cx', lerpNum(MOODS.map(x=>x.glow.cx), m));
  g.setAttribute('cy', lerpNum(MOODS.map(x=>x.glow.cy), m));
  g.setAttribute('r', lerpNum(MOODS.map(x=>x.glow.r), m));
  g.setAttribute('opacity', lerpNum(MOODS.map(x=>x.glow.op), m));
  [0,1,2].forEach(i => {
    $('gs'+i).setAttribute('stop-color', lerpColor(MOODS.map(x=>x.glow.stops[i].c), m));
    $('gs'+i).setAttribute('stop-opacity', lerpNum(MOODS.map(x=>x.glow.stops[i].o), m));
  });
  labelEls.forEach((el, i) => {
    el.style.opacity = Math.max(0, 1 - Math.abs(m - i) * 2);
  });
  $('track').style.background = lerpColor(BG, m);
  dotEls.forEach(d => d.style.background = lerpColor(DOTS, m));
  $('knob').style.transform = `translateX(${m/4*TRAVEL}px)`;
}

// ——— gesture + spring ———
let mood = 2, target = null, vel = 0, dragging = false, raf = null;
function tick() {
  if (target !== null && !dragging) {
    // critically-damped-ish spring
    const k = 0.12, damp = 0.72;
    vel = vel * damp + (target - mood) * k;
    mood += vel;
    if (Math.abs(target - mood) < 0.001 && Math.abs(vel) < 0.001) { mood = target; target = null; }
  }
  render(mood);
  raf = requestAnimationFrame(tick);
}
const track = $('track');
function moodFromEvent(e) {
  const r = track.getBoundingClientRect();
  const scale = r.width / TRACK_W;
  const x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left - KNOB*scale/2;
  return Math.min(4, Math.max(0, x / (TRAVEL*scale) * 4));
}
function down(e) { dragging = true; vel = 0; target = null; mood = moodFromEvent(e); e.preventDefault(); }
function move(e) { if (dragging) { mood = moodFromEvent(e); e.preventDefault(); } }
function up() { if (dragging) { dragging = false; target = Math.round(mood); } }
track.addEventListener('mousedown', down); window.addEventListener('mousemove', move); window.addEventListener('mouseup', up);
track.addEventListener('touchstart', down, {passive:false}); window.addEventListener('touchmove', move, {passive:false}); window.addEventListener('touchend', up);

render(mood); tick();
</script>
